<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Example</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;

            /* 4 equal columns */
            grid-template-columns: repeat(4, 1fr);

            /* Header, boxes, main/sidebar, footer */
            grid-template-rows: 190px 280px 340px 190px;

            gap: 5px;
            padding: 5px;
            height: 100vh;
        }

        .header {
            grid-column: 1 / 5;
            background-color: orangered;
            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header h1 {
            margin: 0 0 25px;
        }

        .nav {
            display: flex;
            gap: 180px;
            font-size: 25px;
            font-weight: bold;
        }

        .box {
            background-color: #16a9e8;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: bold;
        }

        .box1 {
            grid-column: 1;
        }

        .box2 {
            grid-column: 2;
        }

        .box3 {
            grid-column: 3;
        }

        .sidebar {
            grid-column: 4;
            grid-row: 2 / 4;

            background-color: #3ddd70;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: bold;
        }

        .main {
            grid-column: 1 / 4;

            background-color: yellow;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: bold;
        }

        .footer {
            grid-column: 1 / 5;

            background-color: #222be8;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <h1>Header Element</h1>

            <div class="nav">
                <span>Home</span>
                <span>About</span>
                <span>Login</span>
            </div>
        </header>

        <!-- Small Boxes -->
        <div class="box box1">SmallBox1</div>

        <div class="box box2">SmallBox2</div>

        <div class="box box3">SmallBox3</div>

        <!-- Sidebar -->
        <aside class="sidebar">
            Side Bar
        </aside>

        <!-- Main Content -->
        <main class="main">
            MainContent
        </main>

        <!-- Footer -->
        <footer class="footer">
            Footer
        </footer>

    </div>

</body>
</html>
